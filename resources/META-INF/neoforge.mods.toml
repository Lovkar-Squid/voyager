# The Observatory is built around Exposure and Exposure: Space. They are optional so a colony that
# only wants the Departure Point still loads, but without them the Observatory's blueprints lose
# the analyser, the lightroom and the photograph frames.
[[dependencies.voyager]]
modId="exposure"
type="optional"
versionRange="[1.9,)"
ordering="AFTER"
side="BOTH"

[[dependencies.voyager]]
modId="exposure_space"
type="optional"
versionRange="[1.2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.voyager]]
modId="domum_ornamentum"
type="required"
versionRange="[1.0,)"
ordering="AFTER"
side="BOTH"

# The astronomer's night shift. MineColonies writes the decision to go to bed straight into
# CitizenAI.calculateNextState with only a guard-job exemption, so the one job in this mod whose
# point is the dark needs this to stay awake for it. See mixin/CitizenAINightShiftMixin.java.
[[mixins]]
config="voyager.mixins.json"
