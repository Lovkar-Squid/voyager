# Seeded by run-rigtest.ps1 -Name expedition -Mode lost: a short level-5 trip with the dragon certain on the
# itinerary and a Voyager who can be lost (the default); the probe takes the sword, the armour and the
# rations away on the way out, so the fight is lost. Every reward chance is 1.0: a lost Voyager must still
# bring none. Every key is set, so a value that silently fell back to the mod's default shows in the
# probe's config check.

[expeditions]
	tripsPerLaunchWindow = 2
	rationsPerVoyager = 4
	supplyMultiplier = 1.0
	tripLengthMultiplier = 0.25
	dragonChance = 1.0
	permanentDeath = true

[rewards]
	souvenirChance = 1.0
	endCityBookChance = 1.0
	endMapChance = 1.0
	bookEnchantments = ["minecraft:protection", "minecraft:fire_protection", "minecraft:blast_protection", "minecraft:projectile_protection", "minecraft:feather_falling", "minecraft:respiration", "minecraft:depth_strider", "minecraft:unbreaking", "minecraft:efficiency", "minecraft:fortune", "minecraft:silk_touch", "minecraft:sharpness", "minecraft:smite", "minecraft:looting", "minecraft:power", "minecraft:punch"]
